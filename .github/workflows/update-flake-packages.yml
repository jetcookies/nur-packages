name: "Update Flake Packages ❄️"
on:
  schedule:
    - cron:  '0 10 * * 0' # https://crontab.guru/#0_10_*_*_0
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install nix
      uses: cachix/install-nix-action@v31.10.7
      with:
        nix_path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz"
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Update packages
      run: nix-shell helpers/update.nix
    - name: Create PR
      id: update
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        token: ${{ secrets.NIX_UPDATE_PR_TOKEN }}
        branch: chore/nix_update_actions
        delete-branch: true
        title: "Packages: update"
        labels: "automated"
